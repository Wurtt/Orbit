  <style>

:99px;overflow:hidden}.bar-fill{height:100%;background:var(--c,var(--accent));border-radius:inherit}.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:.78rem;font-weight:800;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--panel);border-radius:9px;padding:10px 11px}.field textarea{min-height:90px;resize:vertical}.check-row{display:flex;align-items:center;gap:8px;min-height:38px}.subtasks{display:grid;gap:7px}.subtask-edit{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center}.subtask-edit input[type=text]{padding:8px}.schedule-editor{display:grid;gap:8px}.schedule-row{display:grid;grid-template-columns:82px 82px 1fr auto;gap:8px}.schedule-row input,.schedule-row select{min-width:0}.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.theme-swatch{border:2px solid transparent;background:var(--panel2);border-radius:10px;padding:8px;text-align:left}.theme-swatch.active{border-color:var(--accent)}.theme-preview{height:30px;border-radius:6px;margin-bottom:5px}.dialog{border:0;padding:0;border-radius:16px;max-width:min(680px,calc(100vw - 28px));width:100%;background:var(--panel);color:var(--text);box-shadow:0 24px 80px rgba(0,0,0,.28)}.dialog::backdrop{background:rgba(11,14,24,.55);backdrop-filter:blur(3px)}.dialog-head,.dialog-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;border-bottom:1px solid var(--border)}.dialog-foot{border-bottom:0;border-top:1px solid var(--border);justify-content:flex-end}.dialog-body{padding:20px;max-height:72vh;overflow:auto}.quick-types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.quick-type{border:1px solid var(--border);background:var(--panel2);padding:10px 5px;border-radius:9px;font-size:     @media(max-width:980px){.dashboard,.notes-layout,.charts,.settings-grid{grid-template-columns:1fr}.sidebar{width:84px;padding-inline:10px}.brand strong,.brand span,.side-date,.nav-btn span:not(.icon),.save-state span{display:none}.brand{justify-content:center;padding-inline:0}.nav-btn{justify-content:center}.main{margin-left:84px;padding-inline:20px}.subject-card{min-width:0}}
    @media(max-width:700px){:root{--gap:12px}.sidebar{display:none}.main{margin-left:0;padding:18px 14px 92px}.topbar{align-items:center}.topbar .date-sub{display:none}.top-actions .search-launch{display:none}.card{padding:16px}.dashboard{grid-template-columns:1fr}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;height:70px;background:var(--panel);border-top:1px solid var(--border);grid-template-columns:repeat(5,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom)}.mobile-nav button{border:0;background:transparent;font-size:.68rem;color:var(--muted);display:grid;place-content:center;gap:2px}.mobile-nav button.active{color:var(--accent)}.mobile-nav .icon{font-size:1.15rem}.fab{right:16px;bottom:82px;width:52px;height:52px}.month-grid{min-width:0}.day-cell{min-height:78px;padding:3px}.weekday{padding:7px 2px}.cal-item{font-size:0;width:7px;height:7px;border:0;border-radius:50%;display:inline-block;padding:0;margin:2px;background:var(--c)}.cal-head{align-items:flex-start;flex-wrap:wrap}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick-types{grid-template-columns:repeat(3,1fr)}.theme-grid{grid-template-columns:repeat(2,1fr)}.schedule-row{grid-template-columns:70px 70px 1fr auto}.weekly-strip{overflow:auto;grid-template-columns:repeat(7,84px)}.task-actions .edit-label{display:none}.hero-top{align-items:flex-start;flex-direction:column}.stats-grid{grid-template-columns:1fr 1fr}}

<body>
  <div id="app" class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><div class="brand-mark">◫</div><div><strong>Orbit</strong><span>School agenda</span></div></div>
      <div class="side-date" id="sideDate"></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-bottom"><div class="save-state"><i class="save-dot"></i><span id="saveState">Saved locally</span></div></div>
    </aside>
    <main class="main"><header class="topbar"><div><h1 id="pageTitle">Today</h1><div class="muted date-sub" id="pageSub"></div></div><div class="top-actions"><button class="btn search-launch" data-action="search">⌕ Search</button><button class="btn primary" data-action="quick-add">＋ Add</button></div></header><section id="view" aria-live="polite"></section></main>
    <button class="fab" data-action="quick-add" aria-label="Add assignment">＋</button>
    <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>
  </div>
  <div class="setup hidden" id="setup"><div class="card setup-card"><div class="setup-progress"><i class="on"></i><i></i></div><div id="setupBody"></div></div></div>
  <dialog class="dialog" id="modal"><div class="dialog-head"><h2 id="modalTitle">Add</h2><button class="mini-btn" data-close aria-label="Close dialog">✕</button></div><div class="dialog-body" id="modalBody"></div><div class="dialog-foot" id="modalFoot"></div></dialog>
  <div class="toast-stack" id="toasts" aria-live="assertive"></div>
  <input type="file" id="importFile" accept="application/json" class="hidden">
  <script>
  'use strict';
  /* APP CONFIG */
  const CONFIG={key:'orbit-school-agenda-v1',version:1,maxText:10000};
  const NAV=[['today','⌂','Today'],['tasks','✓','Tasks'],['calendar','▦','Calendar'],['subjects','▤','Subjects'],['notes','✎','Notes'],['focus','◎','Focus'],['progress','◔','Progress'],['settings','⚙','Settings']];
  const THEMES={
    light:{accent:'#5b5bd6',bg:'#f3f5f9',panel:'#ffffff',text:'#182033'},dark:{accent:'#7c83ff',bg:'#171a24',panel:'#212530',text:'#f2f4ff'},midnight:{accent:'#8b8cff',bg:'#090d1a',panel:'#12182a',text:'#edf0ff'},ocean:{accent:'#087ea4',bg:'#eef7fa',panel:'#ffffff',text:'#13303b'},forest:{accent:'#23835b',bg:'#f0f6f2',panel:'#ffffff',text:'#173328'},purple:{accent:'#8b46c7',bg:'#f7f1fa',panel:'#ffffff',text:'#2e183c'},warm:{accent:'#d35f38',bg:'#faf3ed',panel:'#fffdfb',text:'#3a241d'},minimal:{accent:'#222222',bg:'#f7f7f7',panel:'#ffffff',text:'#171717'}
  };
  const DAYN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
  const isoDate=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
  const today=()=>isoDate(new Date()); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmtDate=(d,opt={month:'short',day:'numeric'})=>new Date(d+'T12:00:00').toLocaleDateString(undefined,opt);
  const minutes=t=>{if(!t)return 1440;let [h,m]=t.split(':').map(Number);return h*60+m};
  const defaultState=()=>({version:1,setup:false,profile:{name:'',schoolStart:'08:00',schoolEnd:'15:00',schoolDays:[1,2,3,4,5],semesterStart:'',semesterEnd:'',weekends:true},subjects:[],tasks:[],events:[],notes:[],schedule:{},holidays:[],settings:{theme:'light',custom:{accent:'#5b5bd6',bg:'#f3f5f9',panel:'#ffffff',radius:14,font:16,spacing:'comfortable'},notifications:false},stats:{focusSeconds:0,sessions:[]},createdAt:new Date().toISOString()});
  let state=defaultState(),page='today',calendarDate=new Date(),calendarMode='month',selectedNote=null,focus={taskId:null,running:false,seconds:0,timer:null},filters={q:'',subject:'all',type:'all',priority:'all',status:'active',date:'all',sort:'due'};

  /* DATA STORE */
  const Store={
    load(){try{const raw=localStorage.getItem(CONFIG.key);if(raw)state=this.validate(JSON.parse(raw));}catch(e){toast('Saved data could not be read. A fresh planner was opened.','error');state=defaultState()}},
    validate(x){if(!x||typeof x!=='object'||!Array.isArray(x.tasks)||!Array.isArray(x.subjects))throw Error('Invalid data');return Object.assign(defaultState(),x,{profile:Object.assign(defaultState().profile,x.profile||{}),settings:Object.assign(defaultState().settings,x.settings||{}),stats:Object.assign(defaultState().stats,x.stats||{})})},
    save(){document.getElementById('saveState').textContent='Saving…';clearTimeout(this.t);this.t=setTimeout(()=>{try{localStorage.setItem(CONFIG.key,JSON.stringify(state));document.getElementById('saveState').textContent='✓ Saved';}catch(e){toast('Could not save. Browser storage may be full or unavailable.','error');document.getElementById('saveState').textContent='Save failed'}},180)},
    mutate(fn){fn(state);this.save();render()}
  };

  /* DATE + STATUS HELPERS */
  function dateDiff(d){const a=new Date(today()+'T12:00:00'),b=new Date(d+'T12:00:00');return Math.round((b-a)/86400000)}
  function dueStatus(t){if(t.completed)return ['completed','✓ Completed'];const n=dateDiff(t.dueDate);if(n<0)return ['overdue','● Overdue'];if(n===0)return ['today','● Due today'];if(n===1)return ['tomorrow','● Due tomorrow'];return ['upcoming',`● ${n} days`];}
  function subject(id){return state.subjects.find(s=>s.id===id)||{name:'General',color:'#7c8496',icon:'📘'};}
  function taskProgress(t){if(t.subtasks?.length)return Math.round(t.subtasks.filter(x=>x.done).length/t.subtasks.length*100);return t.completed?100:(t.progress==='In Progress'?50:0)}
  function thisWeek(d){const now=new Date(),x=new Date(d+'T12:00:00'),start=new Date(now);start.setDate(now.getDate()-now.getDay());start.setHours(0,0,0,0);const end=new Date(start);end.setDate(start.getDate()+7);return x>=start&&x<end}
  function taskMatches(t){const blob=[t.title,t.description,t.type,subject(t.subjectId).name].join(' ').toLowerCase();if(filters.q&&!blob.includes(filters.q.toLowerCase()))return false;if(filters.subject!=='all'&&t.subjectId!==filters.subject)return false;if(filters.type!=='all'&&t.type!==filters.type)return false;if(filters.priority!=='all'&&t.priority!==filters.priority)return false;if(filters.status==='active'&&t.completed)return false;if(filters.status==='done'&&!t.completed)return false;const n=dateDiff(t.dueDate);if(filters.date==='overdue'&&!(n<0&&!t.completed))return false;if(filters.date==='today'&&n!==0)return false;if(filters.date==='tomorrow'&&n!==1)return false;if(filters.date==='week'&&!thisWeek(t.dueDate))return false;return true}
  function sortedTasks(list){return [...list].sort((a,b)=>{if(filters.sort==='latest')return b.dueDate.localeCompare(a.dueDate)||minutes(b.dueTime)-minutes(a.dueTime);if(filters.sort==='priority')return ['Urgent','High','Normal','Low'].indexOf(a.priority)-['Urgent','High','Normal','Low'].indexOf(b.priority);if(filters.sort==='subject')return subject(a.subjectId).name.localeCompare(subject(b.subjectId).name);if(filters.sort==='recent')return (b.createdAt||'').localeCompare(a.createdAt||'');return a.dueDate.localeCompare(b.dueDate)||minutes(a.dueTime)-minutes(b.dueTime)})}

  /* UI PRIMITIVES */
  function toast(msg,type='',undo){const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${type==='error'?'⚠ ':''}${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;document.getElementById('toasts').append(el);if(undo)el.querySelector('button').onclick=()=>{undo();el.remove()};setTimeout(()=>el.remove(),undo?7000:4000)}
  function empty(icon,title,action,label){return `<div class="empty"><div class="empty-icon">${icon}</div><strong>${title}</strong><p>${action?'Add something to get started.':'Nothing needs your attention here.'}</p>${action?`<button class="btn primary" data-action="${action}">${label}</button>`:''}</div>`}
  function taskRow(t,draggable=false){const s=subject(t.subjectId),[cl,tx]=dueStatus(t),pct=taskProgress(t);return `<article class="task-row ${t.completed?'done':''}" draggable="${draggable}" data-task="${t.id}"><button class="task-check ${t.completed?'checked':''}" data-action="toggle-task" data-id="${t.id}" aria-label="${t.completed?'Restore':'Complete'} ${esc(t.title)}">${t.completed?'✓':''}</button><div class="task-main" data-action="task-detail" data-id="${t.id}" tabindex="0"><div class="task-title">${esc(t.title)}</div><div class="task-meta"><span><i class="subject-dot" style="background:${s.color}"></i> ${esc(s.name)}</span><span>${esc(t.type)}</span><span class="badge ${cl}">${tx}${t.dueTime?' · '+formatTime(t.dueTime):''}</span>${t.priority!=='Normal'?`<span>${esc(t.priority)} priority</span>`:''}</div>${t.subtasks?.length?`<div class="progress-line" title="${pct}% complete"><i style="width:${pct}%;background:${s.color}"></i></div>`:''}</div><div class="task-actions"><button class="mini-btn" data-action="focus-task" data-id="${t.id}" title="Focus">◎</button><button class="mini-btn" data-action="edit-task" data-id="${t.id}" title="Edit"><span class="edit-label">Edit</span> ✎</button></div></article>`}
  function formatTime(t){if(!t)return'';let[h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
  function pageHead(title,sub){document.getElementById('pageTitle').textContent=title;document.getElementById('pageSub').textContent=sub||''}

  /* RENDERER */
  function render(){applyTheme();renderNav();const v=document.getElementById('view');({today:renderToday,tasks:renderTasks,calendar:renderCalendar,subjects:renderSubjects,notes:renderNotes,focus:renderFocus,progress:renderProgress,settings:renderSettings}[page]||renderToday)(v);checkReminders()}
  function renderNav(){const html=NAV.map(n=>`<button class="nav-btn ${page===n[0]?'active':''}" data-page="${n[0]}"><i class="icon">${n[1]}</i><span>${n[2]}</span></button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('mobileNav').innerHTML=NAV.slice(0,5).map(n=>`<button class="${page===n[0]?'active':''}" data-page="${n[0]}"><i class="icon">${n[1]}</i><span>${n[2]}</span></button>`).join('');const d=new Date();document.getElementById('sideDate').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});}
  function renderToday(v){const now=new Date(),hr=now.getHours(),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';pageHead(`${g}${state.profile.name?', '+state.profile.name:''}`,now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}));const dayTasks=sortedTasks(state.tasks.filter(t=>!t.completed&&dateDiff(t.dueDate)<=1)).slice(0,8);const week=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-d.getDay()+i);const ds=isoDate(d),count=state.tasks.filter(t=>t.dueDate===ds&&!t.completed).length;return `<button class="week-day ${ds===today()?'today':''}" data-action="open-day" data-date="${ds}"><strong>${d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase()} ${d.getDate()}</strong><span>${count} task${count===1?'':'s'}</span></button>`}).join('');const sched=todaysSchedule();const cur=currentClasses(sched);const stats=getStats();v.innerHTML=`<div class="grid dashboard"><div class="stack"><section class="card hero-card"><div class="hero-top"><div><div class="eyebrow" style="color:#fff">${cur.current?'Current class':'Today’s schedule'}</div><div class="current-class">${cur.current?esc(cur.current.name):sched.length?'Classes begin at '+formatTime(sched[0].start):'No classes scheduled'}</div><div class="muted">${cur.current?`Until ${formatTime(cur.current.end)}`:cur.next?`${esc(cur.next.name)} at ${formatTime(cur.next.start)}`:'Enjoy the open time'}</div></div>${cur.next?`<div><div class="eyebrow" style="color:#fff">Next class</div><strong>${esc(cur.next.name)}</strong><div class="small">${cur.mins>0?'Starts in '+cur.mins+' min':'Starting now'}</div></div>`:''}</div>${sched.length?`<div class="schedule-strip" style="margin-top:22px">${sched.map(x=>`<div class="period ${cur.current===x?'now':''}"><span class="small">${formatTime(x.start)}</span><strong>${esc(x.name)}</strong></div>`).join('')}</div>`:''}</section><section class="card"><div class="section-head"><h2>To do & coming up</h2><button class="mini-btn" data-page="tasks">View all</button></div><div class="task-list">${dayTasks.length?dayTasks.map(t=>taskRow(t)).join(''):empty('✓','You’re all caught up!','quick-add','Add assignment')}</div></section><section><div class="section-head"><h2>This week</h2></div><div class="weekly-strip">${week}</div></section></div><aside class="stack"><section class="card"><div class="section-head"><h2>Weekly progress</h2><span class="badge upcoming">Gentle momentum</span></div><div style="display:flex;align-items:center;gap:22px"><div class="progress-ring" style="--pct:${stats.weekRate}"><span>${stats.weekRate}%</span></div><div><p><strong>${stats.completedToday}</strong><br><span class="muted small">completed today</span></p><p><strong>${stats.remaining}</strong><br><span class="muted small">remaining</span></p></div></div></section><section class="card"><h2>At a glance</h2><div class="grid stats-grid"><div class="stat"><strong>${stats.dueWeek}</strong><span class="small muted">Due this week</span></div><div class="stat"><strong>${stats.overdue}</strong><span class="small muted">Overdue</span></div><div class="stat"><strong>${state.tasks.filter(t=>t.type==='Test'||t.type==='Quiz').filter(t=>!t.completed).length}</strong><span class="small muted">Tests ahead</span></div><div class="stat"><strong>${Math.floor(state.stats.focusSeconds/60)}</strong><span class="small muted">Focus minutes</span></div></div></section></aside></div>`}

  function renderTasks(v){pageHead('Tasks','Homework, assignments, projects, tests, and study plans');const list=sortedTasks(state.tasks.filter(taskMatches));v.innerHTML=`<div class="toolbar"><label class="control search">⌕<input id="taskSearch" placeholder="Search tasks, notes, subjects…" value="${esc(filters.q)}" aria-label="Search tasks"></label>${selectHTML('filterSubject',[['all','All subjects'],...state.subjects.filter(s=>!s.archived).map(s=>[s.id,s.name])],filters.subject)}${selectHTML('filterType',[['all','All types'],...['Homework','Assignment','Project','Test','Quiz','Study','Reading','Essay','Presentation','Other'].map(x=>[x,x])],filters.type)}${selectHTML('filterDate',[['all','Any due date'],['overdue','Overdue'],['today','Today'],['tomorrow','Tomorrow'],['week','This week']],filters.date)}${selectHTML('filterStatus',[['active','Active'],['done','Completed'],['all','All']],filters.status)}${selectHTML('filterSort',[['due','Due soonest'],['latest','Due latest'],['priority','Priority'],['subject','Subject'],['recent','Recently added']],filters.sort)}</div><div class="task-board" id="taskBoard">${list.length?list.map(t=>taskRow(t,true)).join(''):empty('☀','No matching tasks',filters.q?'':'quick-add','Add assignment')}</div>`}
  function selectHTML(id,opts,val){return `<select class="control" id="${id}" aria-label="${id}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`}

  function renderSubjects(v){pageHead('Subjects','Classes, teachers, rooms, schedules, and notes');const items=state.subjects.filter(s=>!s.archived).sort((a,b)=>(a.order||0)-(b.order||0));v.innerHTML=`<div class="section-head"><p class="muted">${items.length} active subject${items.length===1?'':'s'}</p><button class="btn primary" data-action="add-subject">＋ Subject</button></div><div class="grid subjects-grid" id="subjectGrid">${items.length?items.map(s=>{const count=state.tasks.filter(t=>t.subjectId===s.id&&!t.completed).length;return `<article class="card subject-card" style="--subject:${s.color}" draggable="true" data-subject="${s.id}"><div class="subject-head"><div class="subject-icon">${esc(s.icon||'📘')}</div><div><h3 style="margin:0">${esc(s.name)}</h3><div class="small muted">${esc(s.teacher||'No teacher')}${s.room?' · Room '+esc(s.room):''}</div></div><div class="subject-actions"><button class="mini-btn" data-action="edit-subject" data-id="${s.id}">•••</button></div></div><p class="small muted" style="margin:15px 0">${esc(s.notes||'No subject notes yet.')}</p><div class="section-head"><span class="badge">${count} open task${count===1?'':'s'}</span><button class="mini-btn" data-action="filter-subject" data-id="${s.id}">View tasks</button></div></article>`}).join(''):empty('📚','Add your first subject','add-subject','Add subject')}</div>${state.subjects.some(s=>s.archived)?`<div style="margin-top:24px"><button class="btn" data-action="show-archive">Archived subjects (${state.subjects.filter(s=>s.archived).length})</button></div>`:''}`}

  function renderCalendar(v){const label=calendarMode==='day'?calendarDate.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}):calendarMode==='week'?weekLabel(calendarDate):calendarDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});pageHead('Calendar','Drag assignments to reschedule them');v.innerHTML=`<section class="card calendar-shell"><div class="cal-head"><div style="display:flex;gap:6px"><button class="btn icon-btn" data-action="cal-prev" aria-label="Previous">‹</button><button class="btn" data-action="cal-today">Today</button><button class="btn icon-btn" data-action="cal-next" aria-label="Next">›</button></div><strong>${label}</strong><div class="segmented">${['month','week','day'].map(x=>`<button class="${calendarMode===x?'active':''}" data-action="cal-mode" data-mode="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div><div id="calendarBody">${calendarMode==='month'?monthHTML():calendarMode==='week'?weekHTML():dayHTML()}</div></section>`}
  function allItemsForDate(ds){return [...state.tasks.filter(t=>t.dueDate===ds).map(t=>({...t,kind:'task'})),...state.events.filter(e=>e.date===ds).map(e=>({...e,kind:'event'}))]}
  function monthHTML(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let cells='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=isoDate(d),items=allItemsForDate(ds);cells+=`<div class="day-cell ${d.getMonth()!==m?'out':''}" data-date="${ds}"><button class="day-num ${ds===today()?'today':''}" data-action="open-day" data-date="${ds}">${d.getDate()}</button>${items.slice(0,4).map(x=>calItem(x)).join('')}${items.length>4?`<div class="small muted">+${items.length-4} more</div>`:''}</div>`}return `<div class="month-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div>`}
  function weekStart(d){const x=new Date(d);x.setDate(x.getDate()-x.getDay());return x}function weekLabel(d){const a=weekStart(d),b=new Date(a);b.setDate(a.getDate()+6);return `${a.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${b.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`}
  function weekHTML(){const a=weekStart(calendarDate);return `<div class="week-grid">${Array.from({length:7},(_,i)=>{const d=new Date(a);d.setDate(a.getDate()+i);const ds=isoDate(d),items=allItemsForDate(ds);return `<div class="week-col ${ds===today()?'today':''}" data-date="${ds}"><button class="day-num ${ds===today()?'today':''}" data-action="open-day" data-date="${ds}">${d.toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</button>${items.map(x=>calItem(x)).join('')}</div>`}).join('')}</div>`}
  function dayHTML(){const ds=isoDate(calendarDate),items=allItemsForDate(ds);return `<div class="day-agenda"><div class="section-head"><h2>${items.length} item${items.length===1?'':'s'}</h2><button class="btn primary" data-action="quick-date" data-date="${ds}">＋ Add for this day</button></div><div class="task-list">${items.length?items.map(x=>x.kind==='task'?taskRow(x):`<article class="task-row"><div>●</div><div><div class="task-title">${esc(x.title)}</div><div class="task-meta">${esc(x.type||'Event')} ${x.time?'· '+formatTime(x.time):''}</div></div><button class="mini-btn" data-action="edit-event" data-id="${x.id}">Edit</button></article>`).join(''):empty('▦','Nothing planned for this day','quick-date','Add item')}</div></div>`}
  function calItem(x){let s=x.kind==='task'?subject(x.subjectId):{color:x.color||'#667085'};return `<button class="cal-item" style="--c:${s.color}" draggable="${x.kind==='task'}" data-task="${x.kind==='task'?x.id:''}" data-action="${x.kind==='task'?'task-detail':'edit-event'}" data-id="${x.id}" title="${esc(x.title)}">${x.kind==='task'&&x.completed?'✓ ':''}${esc(x.title)}</button>`}

  function renderNotes(v){pageHead('Notes','Subject notes and general school notes');const notes=[...state.notes].sort((a,b)=>(b.pinned-a.pinned)||(b.updatedAt||'').localeCompare(a.updatedAt||''));if(!selectedNote&&notes[0])selectedNote=notes[0].id;const n=notes.find(x=>x.id===selectedNote);v.innerHTML=`<div class="grid notes-layout"><aside class="card"><div class="section-head"><h2>All notes</h2><button class="mini-btn" data-action="add-note">＋</button></div><div class="note-list">${notes.length?notes.map(x=>`<button class="note-link ${x.id===selectedNote?'active':''}" data-action="select-note" data-id="${x.id}"><strong>${x.pinned?'★ ':''}${esc(x.title||'Untitled')}</strong><div class="small muted">${esc(subject(x.subjectId).name)} · ${fmtDate((x.updatedAt||today()).slice(0,10))}</div></button>`).join(''):empty('✎','No notes yet','add-note','New note')}</div></aside><section class="card">${n?`<div class="note-editor"><div class="section-head"><select class="control" id="noteSubject"><option value="">General school</option>${state.subjects.filter(s=>!s.archived).map(s=>`<option value="${s.id}" ${n.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><div><button class="mini-btn" data-action="pin-note" data-id="${n.id}">${n.pinned?'★ Pinned':'☆ Pin'}</button><button class="mini-btn" data-action="delete-note" data-id="${n.id}">Delete</button></div></div><input id="noteTitle" maxlength="160" value="${esc(n.title)}" placeholder="Note title"><textarea id="noteText" maxlength="${CONFIG.maxText}" placeholder="Start writing…">${esc(n.text)}</textarea><div class="small muted">Autosaves as you type</div></div>`:empty('📝','Choose or create a note','add-note','New note')}</section></div>`}

  function renderFocus(v){pageHead('Focus','One task, one calm workspace');const active=state.tasks.filter(t=>!t.completed);v.innerHTML=`<div class="focus-picker"><section class="card"><div class="eyebrow">Choose a task</div><h2 style="font-size:1.5rem;margin-top:5px">What will you make progress on?</h2>${active.length?`<div class="task-list">${sortedTasks(active).map(t=>`<article class="task-row"><div class="subject-icon" style="background:${subject(t.subjectId).color}20">${subject(t.subjectId).icon}</div><div><div class="task-title">${esc(t.title)}</div><div class="task-meta">${esc(subject(t.subjectId).name)} · ${t.estimated||30} min estimated</div></div><button class="btn" data-action="start-focus" data-id="${t.id}">Start focus</button></article>`).join('')}</div>`:empty('◎','No active tasks','quick-add','Add assignment')}</section></div>`}

  function renderProgress(v){pageHead('Progress','Useful patterns, without pressure');const st=getStats(),by={};state.tasks.forEach(t=>{const s=subject(t.subjectId);by[s.name]=by[s.name]||{count:0,color:s.color};if(t.completed)by[s.name].count++});const max=Math.max(1,...Object.values(by).map(x=>x.count));const completed=state.tasks.filter(t=>t.completed).length;v.innerHTML=`<div class="grid stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:16px"><div class="card stat"><strong>${completed}</strong><span>Assignments completed</span></div><div class="card stat"><strong>${st.weekRate}%</strong><span>This week’s completion</span></div><div class="card stat"><strong>${st.remaining}</strong><span>Tasks remaining</span></div><div class="card stat"><strong>${Math.floor(state.stats.focusSeconds/60)}</strong><span>Focus minutes</span></div></div><div class="grid charts"><section class="card"><h2>Completed by subject</h2>${Object.keys(by).length?`<div class="bar-chart">${Object.entries(by).map(([name,x])=>`<div class="bar-row"><span>${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${x.count/max*100}%;--c:${x.color}"></div></div><strong>${x.count}</strong></div>`).join('')}</div>`:empty('◔','No activity yet')}</section><section class="card"><h2>Completion history</h2><div class="task-list">${historyHTML()}</div></section></div>`}
  function historyHTML(){const done=[...state.tasks].filter(t=>t.completed).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));if(!done.length)return empty('✓','Completed work will appear here');let last='';return done.map(t=>{const d=(t.completedAt||today()).slice(0,10),diff=dateDiff(d),group=diff===0?'Today':diff===-1?'Yesterday':thisWeek(d)?'This week':'Earlier',late=new Date(t.completedAt)>new Date(t.dueDate+'T'+(t.dueTime||'23:59'));const head=group!==last?(last=group,`<div class="eyebrow" style="margin-top:10px">${group}</div>`):'';return head+`<article class="task-row done"><button class="task-check checked" data-action="toggle-task" data-id="${t.id}">✓</button><div><div class="task-title">${esc(t.title)}</div><div class="task-meta">${esc(subject(t.subjectId).name)} · ${late?'Completed after deadline':'Completed on time'}</div></div><button class="mini-btn" data-action="toggle-task" data-id="${t.id}">Restore</button></article>`}).join('')}

  function renderSettings(v){pageHead('Settings','Personalize school days, appearance, reminders, and data');const p=state.profile,c=state.settings.custom;v.innerHTML=`<div class="grid settings-grid"><section class="card"><h2>School profile</h2><div class="form-grid"><div class="field full"><label>Name or nickname</label><input id="setName" value="${esc(p.name)}" maxlength="60"></div><div class="field"><label>School starts</label><input type="time" id="setStart" value="${p.schoolStart}"></div><div class="field"><label>School ends</label><input type="time" id="setEnd" value="${p.schoolEnd}"></div><div class="field"><label>Semester start</label><input type="date" id="setSemStart" value="${p.semesterStart}"></div><div class="field"><label>Semester end</label><input type="date" id="setSemEnd" value="${p.semesterEnd}"></div><div class="field full"><label>School days</label><div>${DAYN.map((x,i)=>`<label class="check-row" style="display:inline-flex;margin-right:12px"><input type="checkbox" name="schoolDay" value="${i}" ${p.schoolDays.includes(i)?'checked':''}>${x.slice(0,3)}</label>`).join('')}</div></div></div><button class="btn primary" data-action="save-profile">Save profile</button></section><section class="card"><h2>Theme</h2><div class="theme-grid">${Object.entries(THEMES).map(([k,t])=>`<button class="theme-swatch ${state.settings.theme===k?'active':''}" data-action="theme" data-theme="${k}"><div class="theme-preview" style="background:linear-gradient(135deg,${t.bg} 50%,${t.accent} 50%)"></div>${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}<button class="theme-swatch ${state.settings.theme==='custom'?'active':''}" data-action="theme" data-theme="custom"><div class="theme-preview" style="background:linear-gradient(135deg,${c.bg} 50%,${c.accent} 50%)"></div>Custom</button></div><div class="form-grid" style="margin-top:16px"><div class="field"><label>Custom accent</label><input type="color" id="customAccent" value="${c.accent}"></div><div class="field"><label>Custom background</label><input type="color" id="customBg" value="${c.bg}"></div><div class="field"><label>Panel color</label><input type="color" id="customPanel" value="${c.panel}"></div><div class="field"><label>Corner radius</label><input type="range" id="customRadius" min="2" max="24" value="${c.radius}"></div><div class="field"><label>Font size</label><input type="range" id="customFont" min="14" max="20" value="${c.font}"></div><div class="field"><label>Spacing</label><select id="customSpacing"><option value="compact" ${c.spacing==='compact'?'selected':''}>Compact</option><option value="comfortable" ${c.spacing==='comfortable'?'selected':''}>Comfortable</option></select></div></div><button class="btn" data-action="save-custom">Apply custom theme</button></section><section class="card"><h2>Schedule & days off</h2><p class="muted small">Edit each weekday’s class times. Current and next class use your device’s local time.</p><button class="btn" data-action="edit-schedule">Edit weekly schedule</button><button class="btn" data-action="add-holiday">Add holiday / day off</button>${state.holidays.length?`<div style="margin-top:12px">${state.holidays.map(h=>`<span class="badge">${fmtDate(h.date)} · ${esc(h.name)}</span>`).join(' ')}</div>`:''}</section><section class="card"><h2>Reminders</h2><p>Browser notifications work while this page is open and permission is granted. A standalone HTML file cannot guarantee notifications while the page or browser is completely closed.</p><button class="btn" data-action="notifications">${NotificationAvailable()?(Notification.permission==='granted'?'✓ Notifications allowed':'Enable browser notifications'):'Notifications unavailable'}</button><p class="small muted">Strong in-app reminders still appear when Orbit is open.</p></section><section class="card"><h2>Backup & restore</h2><p class="muted small">Export a portable JSON copy of everything in your planner.</p><div class="toolbar"><button class="btn" data-action="export">Export backup</button><button class="btn" data-action="import">Import backup</button><button class="btn" data-action="demo">Load demo data</button></div></section><section class="card"><h2>Danger zone</h2><p class="muted small">Reset removes all local planner data after two confirmations.</p><button class="btn danger" data-action="reset">Reset all data</button></section></div>`}

  function taskForm(t={},preset={}){t=Object.assign({title:'',subjectId:'',description:'',assignedDate:today(),dueDate:preset.date||today(),dueTime:'',priority:'Normal',type:preset.type||'Homework',estimated:30,progress:'Not Started',reminder:'none',subtasks:[]},t);return `<div class="quick-types">${['Homework','Assignment','Test','Quiz','Project','Reminder','School Event'].map(x=>`<button class="quick-type ${t.type===x?'active':''}" type="button" data-action="quick-type" data-type="${x}">${x}</button>`).join('')}</div><form id="taskForm" class="form-grid"><input type="hidden" name="id" value="${t.id||''}"><input type="hidden" name="type" value="${esc(t.type)}"><div class="field full"><label>Title *</label><input name="title" required maxlength="180" value="${esc(t.title)}" placeholder="e.g. Chapter 7 problems"></div><div class="field"><label>Subject</label><select name="subjectId"><option value="">General</option>${state.subjects.filter(s=>!s.archived).map(s=>`<option value="${s.id}" ${t.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select name="priority">${['Low','Normal','High','Urgent'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Assigned date</label><input type="date" name="assignedDate" value="${t.assignedDate}"></div><div class="field"><label>Due date *</label><input type="date" name="dueDate" required value="${t.dueDate}"></div><div class="field"><label>Due time</label><input type="time" name="dueTime" value="${t.dueTime||''}"></div><div class="field"><label>Estimated minutes</label><input type="number" min="1" max="999" name="estimated" value="${t.estimated||30}"></div><div class="field"><label>Progress</label><select name="progress">${['Not Started','In Progress','Completed'].map(x=>`<option ${t.progress===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Reminder</label><selec   function saveTask(){const f=document.getElementById('taskForm');if(!f.reportValidity())return;const fd=new FormData(f),title=fd.get('title').trim();if(!title)return toast('Give this task a title.','error');if(fd.get('assignedDate')&&fd.get('dueDate')<fd.get('assignedDate'))return toast('Due date cannot be before the assigned date.','error');const subs=[...document.querySelectorAll('.subtask-edit')].map(r=>({done:r.querySelector('[type=checkbox]').checked,text:r.querySelector('[type=text]').value.trim()})).filter(x=>x.text);const obj={id:fd.get('id')||uid(),title,subjectId:fd.get('subjectId'),description:fd.get('description').slice(0,CONFIG.maxText),assignedDate:fd.get('assignedDate'),dueDate:fd.get('dueDate'),dueTime:fd.get('dueTime'),priority:fd.get('priority'),type:fd.get('type'),estimated:+fd.get('estimated')||30,progress:fd.get('progress'),reminder:fd.get('reminder'),subtasks:subs,createdAt:new Date().toISOString(),completed:fd.get('progress')==='Completed'};const old=state.tasks.find(x=>x.id===obj.id);if(old)Object.assign(old,obj,{createdAt:old.createdAt,completedAt:obj.completed?(old.completedAt||new Date().toISOString()):null});else state.tasks.push(obj);Store.save();Modal.close();render();toast(old?'Task updated':'Task added')}

  /* SCHEDULE, STATS, THEMES */
  function todaysSchedule(){return (state.schedule[new Date().getDay()]||[]).slice().sort((a,b)=>minutes(a.start)-minutes(b.start))}

  /* REMINDERS + NOTIFICATIONS */
  function NotificationAvailable(){return 'Notification'in window}
  async function enableNotifications(){if(!NotificationAvailable())return toast('This browser does not support notifications.','error');try{const p=await Notification.requestPermission();state.settings.notifications=p==='granted';Store.save();toast(p==='granted'?'Notifications enabled while Orbit is open.':'Permission was not granted. In-app reminders remain active.',p==='granted'?'':'error');render()}catch(e){toast('Notification permission could not be requested.','error')}}
  function checkReminders(){const now=Date.now();state.tasks.filter(t=>!t.completed&&t.reminder&&t.reminder!=='none'&&t.dueDate&&t.dueTime).forEach(t=>{const due=new Date(`${t.dueDate}T${t.dueTime}`).getTime(),lead=t.reminder==='due'?0:+t.reminder*60000,trigger=due-lead;if(now>=trigger&&now-trigger<60000&&!t.lastReminded){t.lastReminded=new Date().toISOString();toast(`Reminder: ${t.title} is due ${dueStatus(t)[1].replace('● ','').toLowerCase()}.`);if(NotificationAvailable()&&Notification.permission==='granted')new Notification('Orbit reminder',{body:`${t.title} · ${subject(t.subjectId).name}`});Store.save()}})}

  function loadDemo(){if((state.tasks.length||state.subjects.length)&&!confirm('Add demo data to this planner? Existing data will be kept.'))return;const colors=['#4f67d7','#16845b','#d86d2f','#8b46c7'],names=[['Math','∑'],['Science','⚗'],['English','Aa'],['History','◷']],ids=[];names.forEach((n,i)=>{let id=uid();ids.push(id);state.subjects.push({id,name:n[0],icon:n[1],color:colors[i],teacher:['Ms. Rivera','Mr. Chen','Mrs. Patel','Mr. Lewis'][i],room:String(201+i),notes:'',order:state.subjects.length,archived:false})});const add=(n,sub,days,type,subs=[])=>{let d=new Date();d.setDate(d.getDate()+days);state.tasks.push({id:uid(),title:n,subjectId:ids[sub],description:'Demo assignment — edit or delete anytime.',assignedDate:today(),dueDate:isoDate(d),dueTime:days===0?'20:00':'',priority:days<1?'High':'Normal',type,estimated:35,progress:'Not Started',reminder:'none',subtasks:subs.map(x=>({text:x,done:false})),completed:false,createdAt:new Date().toISOString()})};add('Chapter 7 math problems',0,0,'Homework');add('Cell structure project',1,1,'Project',['Choose topic','Research sources','Create slides','Practice presentation']);add('Read chapter 8',2,2,'Reading');add('Industrial Revolution quiz',3,3,'Quiz',['Review notes','Make flashcards']);state.schedule={1:[{start:'08:00',end:'08:50',name:'Math'},{start:'08:55',end:'09:45',name:'Science'},{start:'09:50',end:'10:40',name:'English'}],2:[{start:'08:00',end:'08:50',name:'History'},{start:'09:00',end:'09:50',name:'Math'}]};Store.save();render();toast('Demo data loaded')}

  /* FOCUS TIMER */

  document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-page],[data-close]');if(!b)return;if(b.dataset.close!==undefined){Modal.close();return}if(b.dataset.page){page=b.dataset.page;render();return}const a=b.dataset.action,id=b.dataset.id;

    else if(a==='cal-prev'||a==='cal-next'){let k=a==='cal-next'?1:-1;if(calendarMode==='month')calendarDate.setMonth(calendarDate.getMonth()+k);else calendarDate.setDate(calendarDate.getDate()+k*(calendarMode==='week'?7:1));render()}else if(a==='cal-today'){calendarDate=new Date();render()}else if(a==='cal-mode'){calendarMode=b.dataset.mode;render()}else if(a==='open-day'){calendarDate=new Date(b.dataset.date+'T12:00:00');calendarMode='day';page='calendar';render()}
    else if(a==='add-note'){const n={id:uid(),title:'',text:'',subjectId:'',pinned:false,updatedAt:new Date().toISOString()};state.notes.push(n);selectedNote=n.id;Store.save();render();setTimeout(()=>document.getElementById('noteTitle')?.focus(),20)}else if(a==='select-note'){selectedNote=id;render()}else if(a==='pin-note'){const n=state.notes.find(x=>x.id===id);n.pinned=!n.pinned;n.updatedAt=new Date().toISOString();Store.save();render()}else if(a==='delete-note'){if(confirm('Delete this note?')){state.notes=state.notes.filter(x=>x.id!==id);selectedNote=null;Store.save();render()}}
    else if(a==='focus-task'||a==='start-focus'){Modal.close();startFocus(id)}else if(a==='focus-toggle'){focus.running=!focus.running;showFocusStage()}else if(a==='focus-finish')finishFocus();else if(a==='theme'){state.settings.theme=b.dataset.theme;Store.save();render()}else if(a==='save-custom'){const c=state.settings.custom;c.accent=document.getElementById('customAccent').value;c.bg=document.getElementById('customBg').value;c.panel=document.getElementById('customPanel').value;c.radius=+document.getElementById('customRadius').value;c.font=+document.getElementById('customFont').value;c.spacing=document.getElementById('customSpacing').value;state.settings.theme='custom';Store.save();render();toast('Custom theme applied')}
    else if(a==='save-profile'){state.profile.name=document.getElementById('setName').value.trim();state.profile.schoolStart=document.getElementById('setStart').value;state.profile.schoolEnd=document.getElementById('setEnd').value;state.profile.semesterStart=document.getElementById('setSemStart').value;state.profile.semesterEnd=document.getElementById('setSemEnd').value;state.profile.schoolDays=[...document.querySelectorAll('[name=schoolDay]:checked')].map(x=>+x.value);Store.save();render();toast('School profile saved')}else if(a==='notifications')enableNotifications();else if(a==='export')exportBackup();else if(a==='import')document.getElementById('importFile').click();else if(a==='demo')loadDemo();else if(a==='reset'){if(confirm('Reset ALL planner data? Export a backup first if you may need it.')&&confirm('Final confirmation: permanently delete all subjects, tasks, notes, and settings?')){localStorage.removeItem(CONFIG.key);state=defaultState();location.reload()}}
    else if(a==='edit-schedule')openScheduleEditor();else if(a==='save-schedule')saveScheduleEditor();else if(a==='add-period')addPeriodRow(b.dataset.day);else if(a==='remove-period')b.closest('.schedule-row').remove();else if(a==='add-holiday')openHoliday();else if(a==='save-holiday')saveHoliday();else if(a==='setup-next'){setupDraft.name=document.getElementById('setupName').value.trim();setupDraft.start=document.getElementById('setupStart').value;setupDraft.end=document.getElementById('setupEnd').value;setupDraft.theme=document.getElementById('setupTheme').value;setupStep=1;renderSetup()}else if(a==='setup-add-subject'){const n=document.getElementById('setupSubjectName').value.trim();if(!n)return toast('Enter a subject name.','error');if(setupDraft.subjects.some(s=>s.name.toLowerCase()===n.toLowerCase()))return toast('That subject is already listed.','error');setupDraft.subjects.push({name:n,color:document.getElementById('setupSubjectColor').value});renderSetup()}else if(a==='setup-remove-subject'){setupDraft.subjects.splice(+b.dataset.index,1);updateSetupSubjects()}else if(a==='setup-finish')finishSetup();else if(a==='demo-setup'){finishSetup();loadDemo()}
  });
  document.addEventListener('input',e=>{if(e.target.id==='taskSearch'){filters.q=e.target.value;renderTasks(document.getElementById('view'));document.getElementById('taskSearch').focus();document.getElementById('taskSearch').setSelectionRange(filters.q.length,filters.q.length)}if(['noteTitle','noteText'].includes(e.target.id)){const n=state.notes.find(x=>x.id===selectedNote);if(n){n[e.target.id==='noteTitle'?'title':'text']=e.target.value.slice(0,CONFIG.maxText);n.updatedAt=new Date().toISOString();Store.save()}}});
  document.addEventListener('change',e=>{const map={filterSubject:'subject',filterType:'type',filterDate:'date',filterStatus:'status',filterSort:'sort'};if(map[e.target.id]){filters[map[e.target.id]]=e.target.value;render()}if(e.target.id==='noteSubject'){const n=state.notes.find(x=>x.id===selectedNote);n.subjectId=e.target.value;n.updatedAt=new Date().toISOString();Store.save()}if(e.target.id==='importFile'&&e.target.files[0])importBackup(e.target.files[0])});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('focusStage')){if(confirm('Finish this focus session?'))finishFocus();return}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key.toLowerCase()==='n'){e.preventDefault();openTask()}if(e.key.toLowerCase()==='f'){e.preventDefault();page='tasks';render();setTimeout(()=>document.getElementById('taskSearch')?.focus(),20)}if(e.key.toLowerCase()==='t'){page='today';render()}if(e.key.toLowerCase()==='c'){page='calendar';render()}});

  /* DRAG + DROP */
  let draggedTask=null,draggedSubject=null;document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-task]'),s=e.target.closest('[data-subject]');if(t?.dataset.task){draggedTask=t.dataset.task;t.classList.add('dragging')}if(s){draggedSubject=s.dataset.subject;s.classList.add('dragging')}});document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'));draggedTask=draggedSubject=null});document.addEventListener('dragover',e=>{const d=e.target.closest('[data-date]'),t=e.target.closest('[data-task]'),s=e.target.closest('[data-subject]');if((draggedTask&&(d||t))||(draggedSubject&&s)){e.preventDefault();(d||t||s).classList.add('drop-target')}});document.addEventListener('drop',e=>{e.preventDefault();document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));const d=e.target.closest('[data-date]'),t=e.target.closest('[data-task]'),s=e.target.closest('[data-subject]');if(d&&draggedTask){const x=state.tasks.find(x=>x.id===draggedTask),nd=d.dataset.date;if(x&&nd&&x.dueDate!==nd&&confirm(`Move “${x.title}” to ${fmtDate(nd)}?`)){x.dueDate=nd;Store.save();render();toast('Due date changed')}}else if(t&&draggedTask&&t.dataset.task!==draggedTask){const a=state.tasks.findIndex(x=>x.id===draggedTask),b=state.tasks.findIndex(x=>x.id===t.dataset.task);state.tasks.splice(b,0,state.tasks.splice(a,1)[0]);Store.save();render()}else if(s&&draggedSubject&&s.dataset.subject!==draggedSubject){const arr=state.subjects.sort((a,b)=>(a.order||0)-(b.order||0)),a=arr.findIndex(x=>x.id===draggedSubject),b=arr.findIndex(x=>x.id===s.dataset.subject);arr.splice(b,0,arr.splice(a,1)[0]);arr.forEach((x,i)=>x.order=i);Store.save();render()}});

  function openScheduleEditor(){Modal.open('Weekly class schedule',`<p class="small muted">Add class periods for each weekday.</p><div id="scheduleEditor">${[1,2,3,4,5].map(day=>`<section style="margin-bottom:18px"><div class="section-head"><strong>${DAYN[day]}</strong><button class="mini-btn" data-action="add-period" data-day="${day}">＋ Period</button></div><div class="schedule-editor" data-day-rows="${day}">${(state.schedule[day]||[]).map(x=>periodRow(x)).join('')}</div></section>`).join('')}</div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" data-action="save-schedule">Save schedule</button>`)}
  function periodRow(x={start:'08:00',end:'08:50',name:''}){return `<div class="schedule-row"><input class="control" type="time" value="${x.start}"><input class="control" type="time" value="${x.end}"><input class="control" value="${esc(x.name)}" placeholder="Class / lunch"><button class="mini-btn" data-action="remove-period">✕</button></div>`}function addPeriodRow(day){document.querySelector(`[data-day-rows="${day}"]`).insertAdjacentHTML('beforeend',periodRow())}function saveScheduleEditor(){const out={};document.querySelectorAll('[data-day-rows]').forEach(g=>{out[g.dataset.dayRows]=[...g.querySelectorAll('.schedule-row')].map(r=>{const i=r.querySelectorAll('input');return{start:i[0].value,end:i[1].value,name:i[2].value.trim()}}).filter(x=>x.name&&x.start&&x.end)});state.schedule=out;Store.save();Modal.close();render();toast('Schedule saved')}
  function openHoliday(){Modal.open('Add holiday or day off',`<form id="holidayForm" class="form-grid"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Name</label><input name="name" value="Day off" required maxlength="100"></div></form>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" data-action="save-holiday">Add day off</button>`)}function saveHoliday(){const f=document.getElementById('holidayForm');if(!f.reportValidity())return;const d=new FormData(f);state.holidays.push({id:uid(),date:d.get('date'),name:d.get('name').trim()});Store.save();Modal.close();render();toast('Day off added')}
  function finishSetup(){state.profile.name=setupDraft.name||'';state.profile.schoolStart=setupDraft.start||'08:00';state.profile.schoolEnd=setupDraft.end||'15:00';state.settings.theme=setupDraft.theme||'light';setupDraft.subjects.forEach((s,i)=>state.subjects.push({id:uid(),name:s.name,color:s.color,icon:'📘',teacher:'',room:'',notes:'',order:i,archived:false}));state.setup=true;Store.save();document.getElementById('setup').classList.add('hidden');render();toast('Your agenda is ready')}

  /* APP INITIALIZATION */
  Store.load();applyTheme();render();if(!state.setup)renderSetup();setInterval(checkReminders,30000);window.addEventListener('storage',e=>{if(e.key===CONFIG.key){Store.load();render();toast('Planner updated from another tab')}});window.addEventListener('beforeunload',()=>{try{localStorage.setItem(CONFIG.key,JSON.stringify(state))}catch(e){}});
  </script>
</body>
</html>
