    /* Responsive fit fixes: layout-only; app behavior/content unchanged */
    html,body{width:100%;max-width:100%;overflow-x:hidden}
    .main{width:auto;min-width:0}
    #view,.stack,.card,.task-main,.toolbar>*{min-width:0}
    img,svg,canvas,video{max-width:100%;height:auto}
    input,select,textarea,button{max-width:100%}
    @media(max-width:1100px){
      .main{padding-left:20px;padding-right:20px}
      .dashboard{grid-template-columns:minmax(0,1.3fr) minmax(250px,.8fr)}
    }
    @media(max-width:820px){
      .dashboard,.notes-layout,.charts,.settings-grid{grid-template-columns:1fr}
      .topbar{flex-wrap:wrap}
      .top-actions{margin-left:auto}
      .toolbar{align-items:stretch}
      .toolbar .control{flex:1 1 180px}
      .schedule-row{grid-template-columns:70px 70px minmax(110px,1fr) auto}
    }
    @media(max-width:700px){
      .main{width:100%;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
      .topbar{gap:10px;margin-bottom:18px}
      .topbar>div:first-child{min-width:0;flex:1}
      .top-actions{flex:0 0 auto}
      .top-actions .btn{padding-inline:12px}
      .card{max-width:100%}
      .task-row{grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:9px}
      .task-actions{flex-direction:column}
      .task-meta{gap:5px}
      .toolbar{display:grid;grid-template-columns:1fr 1fr}
      .toolbar .search{grid-column:1/-1;min-width:0}
      .toolbar .control{width:100%;min-width:0}
      .cal-head>strong{width:100%;text-align:center;order:-1}
      .segmented{max-width:100%;overflow:auto}
      .month-grid{width:100%}
      .weekday{font-size:.65rem}
      .day-num{width:26px;height:26px}
      .notes-layout aside,.notes-layout section{min-width:0}
      .bar-row{grid-template-columns:minmax(72px,95px) minmax(0,1fr) 28px}
      .dialog{max-height:calc(100dvh - 20px)}
      .dialog-body{max-height:calc(100dvh - 150px)}
    }
    @media(max-width:430px){
      :root{--gap:10px}
      .main{padding-top:14px;padding-bottom:88px}
      h1{font-size:1.55rem}
      .top-actions .btn{min-height:38px;padding:7px 10px}
      .card{padding:13px;border-radius:12px}
      .stats-grid{grid-template-columns:1fr 1fr}
      .quick-types{grid-template-columns:repeat(2,1fr)}
      .theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .schedule-row{grid-template-columns:1fr 1fr}
      .schedule-row>*:nth-child(3){grid-column:1/-1}
      .schedule-row>*:nth-child(4){justify-self:end}
      .task-row{grid-template-columns:auto minmax(0,1fr)}
      .task-actions{grid-column:2;flex-direction:row;justify-content:flex-end}
      .hero-card{padding:16px}
      .current-class{font-size:1.3rem}
      .progress-ring{width:100px;height:100px}
      .weekly-strip{grid-template-columns:repeat(7,78px)}
      .mobile-nav{height:66px}
      .fab{bottom:76px}
    }

  let state=defaultState(),page='today',calendarDate=new Date(),calendarMode='month',selectedNote=null,focus={taskId:null,running:false,seconds:0,timer:null},filters={q:'',subject:'all',type:'all',priority:'all',status:'active',date:'all',sort:'due'};
  function seasonDarkEnabled(){const mode=state.settings.seasonMode||'light';return mode==='dark'||(mode==='auto'&&window.matchMedia?.('(prefers-color-scheme: dark)').matches)}

  /* DATA STORE */
  const Persistence={
    db:null,
    async open(){
      if(this.db)return this.db;
      return new Promise((resolve,reject)=>{
        try{
          const req=indexedDB.open('orbit-school-agenda-db',2);
          req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('planner'))db.createObjectStore('planner');if(!db.objectStoreNames.contains('sync'))db.createObjectStore('sync')};

          req.onerror=()=>reject(req.error);
        }catch(e){reject(e)}
      })
    },
    async put(raw){

    },
    async get(){

    },
    async clear(){

    },
    async putSync(value){
      const db=await this.open();return new Promise((resolve,reject)=>{const tx=db.transaction('sync','readwrite');tx.objectStore('sync').put(value,'credentials');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})
    },
    async getSync(){
      try{const db=await this.open();return await new Promise((resolve,reject)=>{const tx=db.transaction('sync','readonly');const req=tx.objectStore('sync').get('credentials');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}catch(_){return null}
    },
    async clearSync(){
      try{const db=await this.open();await new Promise((resolve,reject)=>{const tx=db.transaction('sync','readwrite');tx.objectStore('sync').delete('credentials');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(_){ }
    }
  };

  const Store={
    dirty:false,t:null,lastSavedRaw:'',
    candidates(){
      const keys=[CONFIG.key,CONFIG.recoveryKey,CONFIG.key+'-backup-1',CONFIG.key+'-backup-2'];

    },
    parseCandidate(raw){

    },
    async load(){
      let best=null;
      try{
        for(const raw of this.candidates()){
          const c=this.parseCandidate(raw);if(c&&(!best||c.savedAt>=best.savedAt))best=c
        }
      }catch(_){ }
      if(!best){
        const idbRaw=await Promise.race([Persistence.get(),new Promise(resolve=>setTimeout(()=>resolve(null),1200))]);
        if(idbRaw)best=this.parseCandidate(idbRaw)
      }
      if(best){
        state=best.state;
        calendarMode=state.settings.defaultCalendarView||'month';
        if(!this.lastSavedRaw)page=state.settings.startPage||'today';
        this.lastSavedRaw=JSON.stringify(state);
        try{localStorage.setItem(CONFIG.key,this.lastSavedRaw);localStorage.setItem(CONFIG.recoveryKey,this.lastSavedRaw);localStorage.removeItem(CONFIG.key+'-backup-1');localStorage.removeItem(CONFIG.key+'-backup-2');Persistence.put(this.lastSavedRaw)}catch(_){ }
        return true
      }
      state=defaultState();
      return false
    },
    validate(x){if(!x||typeof x!=='object'||!Array.isArray(x.tasks)||!Array.isArray(x.subjects))throw Error('Invalid data');const d=defaultState(),settings=Object.assign(d.settings,x.settings||{});settings.custom=Object.assign(d.settings.custom,(x.settings&&x.settings.custom)||{});settings.abCycle=Object.assign({},d.settings.abCycle,(x.settings&&x.settings.abCycle)||{});const profile=Object.assign(d.profile,x.profile||{});profile.profileName=String(profile.profileName||profile.schoolName||'').slice(0,160);for(const key of ['schoolName','grade','studentId','semesterStart','semesterEnd'])delete profile[key];if(!profile.firstName&&profile.name){const parts=profile.name.trim().split(/\s+/);profile.firstName=parts.shift()||'';profile.lastName=parts.join(' ')}profile.name=[profile.firstName,profile.lastName].filter(Boolean).join(' ')||profile.name||'';return Object.assign(d,x,{profile,studySets:Array.isArray(x.studySets)?x.studySets:[],settings,stats:Object.assign(d.stats,x.stats||{})})},
    save(){return this.writeNow()},
    writeNow(){
      try{
        for(const key of ['schoolName','grade','studentId','semesterStart','semesterEnd'])delete state.profile[key];
        state._savedAt=new Date().toISOString();
        const raw=JSON.stringify(state);
        const el=document.getElementById('saveState');if(el)el.textContent=state?.settings?.language==='es'?'Guardando…':'Saving…';

          const old1=localStorage.getItem(CONFIG.key+'-backup-1');

          if(old1)localStorage.setItem(CONFIG.key+'-backup-2',old1);

  };

  /* DATE + STATUS HELPERS */
  function dateDiff(d){const a=new Date(today()+'T12:00:00'),b=new Date(d+'T12:00:00');return Math.round((b-a)/86400000)}
  function dueStatus(t){if(t.completed)return ['completed','✓ Completed'];const n=dateDiff(t.dueDate);if(n<0)return ['overdue','● Overdue'];if(n===0)return ['today','● Due today'];if(n===1)return ['tomorrow','● Due tomorrow'];return ['upcoming',`● ${n} days`];}
  function subject(id){return state.subjects.find(s=>s.id===id)||{name:'General',color:'#7c8496',icon:'📘'};}
  function taskProgress(t){if(t.subtasks?.length)return Math.round(t.subtasks.filter(x=>x.done).length/t.subtasks.length*100);return t.completed?100:(t.progress==='In Progress'?50:0)}
  function thisWeek(d){if(!d)return false;const now=new Date(),x=new Date(d+'T12:00:00'),start=new Date(now),offset=state.settings.startWeekOn==='monday'?(now.getDay()+6)%7:now.getDay();start.setDate(now.getDate()-offset);start.setHours(0,0,0,0);const end=new Date(start);end.setDate(start.getDate()+7);return x>=start&&x<end}
  function taskMatches(t){const blob=[t.title,t.description,t.type,subject(t.subjectId).name].join(' ').toLowerCase();if(filters.q&&!blob.includes(filters.q.toLowerCase()))return false;if(filters.subject!=='all'&&t.subjectId!==filters.subject)return false;if(filters.type!=='all'&&t.type!==filters.type)return false;if(filters.priority!=='all'&&t.priority!==filters.priority)return false;if(filters.status==='active'&&t.completed)return false;if(filters.status==='done'&&!t.completed)return false;const n=dateDiff(t.dueDate);if(filters.date==='overdue'&&!(n<0&&!t.completed))return false;if(filters.date==='today'&&n!==0)return false;if(filters.date==='tomorrow'&&n!==1)return false;if(filters.date==='week'&&!thisWeek(t.dueDate))return false;return true}
  function sortedTasks(list){return [...list].sort((a,b)=>{if(filters.sort==='latest')return b.dueDate.localeCompare(a.dueDate)||minutes(b.dueTime)-minutes(a.dueTime);if(filters.sort==='priority')return ['Urgent','High','Normal','Low'].indexOf(a.priority)-['Urgent','High','Normal','Low'].indexOf(b.priority);if(filters.sort==='subject')return subject(a.subjectId).name.localeCompare(subject(b.subjectId).name);if(filters.sort==='recent')return (b.createdAt||'').localeCompare(a.createdAt||'');return a.dueDate.localeCompare(b.dueDate)||minutes(a.dueTime)-minutes(b.dueTime)})}

  function toast(msg,type='',undo){const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${type==='error'?'⚠ ':''}${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;document.getElementById('toasts').append(el);if(undo)el.querySelector('button').onclick=()=>{undo();el.remove()};setTimeout(()=>el.remove(),undo?7000:4000)}

  function formatTime(t){if(!t)return'';let[h,m]=t.split(':').map(Number),mode=state.profile.timeFormat||'auto',options={hour:'numeric',minute:'2-digit'};if(mode==='12')options.hour12=true;else if(mode==='24')options.hour12=false;return new Date(2000,0,1,h,m).toLocaleTimeString([],options)}

  function renderToday(v){const now=new Date(),hr=now.getHours(),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';const greetingName=profileFullName();pageHead(`${g}${greetingName?', '+greetingName:''}`,now.toLocaleDateString(localeTag(),{weekday:'long',month:'long',day:'numeric'}));const dayTasks=sortedTasks(state.tasks.filter(t=>!t.completed&&dateDiff(t.dueDate)<=1)).slice(0,8);const week=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(state.settings.startWeekOn==='monday'?(d.getDay()+6)%7:d.getDay())+i);const ds=isoDate(d),count=state.tasks.filter(t=>t.dueDate===ds&&!t.completed).length;return `<button class="week-day ${ds===today()?'today':''}" data-action="open-day" data-date="${ds}"><strong>${d.toLocaleDateString(localeTag(),{weekday:'short'}).toUpperCase()} ${d.getDate()}</strong><span>${count} task${count===1?'':'s'}</span></button>`}).join('');const sched=todaysSchedule();const cur=currentClasses(sched);const stats=getStats();v.innerHTML=`<div class="grid dashboard"><div class="stack"><section class="card hero-card today-schedule-card"><div class="hero-top"><div><div class="eyebrow" style="color:#fff">${cur.current?'Current class':'Today’s schedule'}</div><div class="current-class">${cur.current?esc(cur.current.name):sched.length?'Classes begin at '+formatTime(sched[0].start):'No classes scheduled'}</div><div class="muted">${cur.current?`Until ${formatTime(cur.current.end)}`:cur.next?`${esc(cur.next.name)} at ${formatTime(cur.next.start)}`:'Enjoy the open time'}</div></div>${cur.next?`<div><div class="eyebrow" style="color:#fff">Next class</div><strong>${esc(cur.next.name)}</strong><div class="small">${cur.mins>0?'Starts in '+cur.mins+' min':'Starting now'}</div></div>`:''}</div>${sched.length?`<div class="schedule-strip" style="margin-top:22px">${sched.map(x=>`<div class="period ${cur.current===x?'now':''}"><span class="small">${formatTime(x.start)}</span><strong>${esc(x.name)}</strong></div>`).join('')}</div>`:''}</section><section class="card"><div class="section-head"><h2>To do & coming up</h2><button class="mini-btn" data-page="tasks">View all</button></div><div class="task-list">${dayTasks.length?dayTasks.map(t=>taskRow(t)).join(''):empty('✓','You’re all caught up!','quick-add','Add assignment')}</div></section><section><div class="section-head"><h2>This week</h2></div><div class="weekly-strip">${week}</div></section></div><aside class="stack"><section class="card"><div class="section-head"><h2>Weekly progress</h2><span class="badge upcoming">Gentle momentum</span></div><div style="display:flex;align-items:center;gap:22px"><div class="progress-ring" style="--pct:${stats.weekRate}"><span>${stats.weekRate}%</span></div><div><p><strong>${stats.completedToday}</strong><br><span class="muted small">completed today</span></p><p><strong>${stats.remaining}</strong><br><span class="muted small">remaining</span></p></div></div></section><section class="card"><h2>At a glance</h2><div class="grid stats-grid"><div class="stat"><strong>${stats.dueWeek}</strong><span class="small muted">Due this week</span></div><div class="stat"><strong>${stats.overdue}</strong><span class="small muted">Overdue</span></div><div class="stat"><strong>${state.tasks.filter(t=>t.type==='Test'||t.type==='Quiz').filter(t=>!t.completed).length}</strong><span class="small muted">Tests ahead</span></div><div class="stat"><strong>${Math.floor(state.stats.focusSeconds/60)}</strong><span class="small muted">Focus minutes</span></div></div></section></aside></div>`}

  function renderTasks(v){pageHead('Tasks','Homework, assignments, projects, tests, and study plans');const list=sortedTasks(state.tasks.filter(taskMatches));v.innerHTML=`<div class="toolbar"><label class="control search">⌕<input id="taskSearch" placeholder="Search tasks, notes, subjects…" value="${esc(filters.q)}" aria-label="Search tasks"></label>${selectHTML('filterSubject',[['all','All subjects'],...state.subjects.filter(s=>!s.archived).map(s=>[s.id,s.name])],filters.subject)}${selectHTML('filterType',[['all','All types'],...['Homework','Assignment','Project','Test','Quiz','Study','Reading','Essay','Presentation','Other'].map(x=>[x,x])],filters.type)}${selectHTML('filterDate',[['all','Any due date'],['overdue','Overdue'],['today','Today'],['tomorrow','Tomorrow'],['week','This week']],filters.date)}${selectHTML('filterStatus',[['active','Active'],['done','Completed'],['all','All']],filters.status)}${selectHTML('filterSort',[['due','Due soonest'],['latest','Due latest'],['priority','Priority'],['subject','Subject'],['recent','Recently added']],filters.sort)}</div><div class="task-board" id="taskBoard">${list.length?list.map(t=>taskRow(t,true)).join(''):empty('☀','No matching tasks',filters.q?'':'quick-add','Add assignment')}</div>`}

  function monthHTML(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let cells='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=isoDate(d),items=allItemsForDate(ds);cells+=`<div class="day-cell ${d.getMonth()!==m?'out':''}" data-date="${ds}"><button class="day-num ${ds===today()?'today':''}" data-action="open-day" data-date="${ds}">${d.getDate()}</button>${items.slice(0,4).map(x=>calItem(x)).join('')}${items.length>4?`<div class="small muted">+${items.length-4} more</div>`:''}</div>`}return `<div class="month-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div>`}

  function todaysSchedule(){return (state.schedule[new Date().getDay()]||[]).slice().sort((a,b)=>minutes(a.start)-minutes(b.start))}
  function currentClasses(arr){const now=new Date().getHours()*60+new Date().getMinutes();let current=arr.find(x=>now>=minutes(x.start)&&now<minutes(x.end)),next=arr.find(x=>minutes(x.start)>now);return{current,next,mins:next?minutes(next.start)-now:0}}
  function getStats(){const active=state.tasks.filter(t=>!t.completed),week=state.tasks.filter(t=>thisWeek(t.dueDate)),doneWeek=week.filter(t=>t.completed),completedToday=state.tasks.filter(t=>t.completedAt?.slice(0,10)===today()).length;return{remaining:active.length,overdue:active.filter(t=>dateDiff(t.dueDate)<0).length,dueWeek:active.filter(t=>thisWeek(t.dueDate)).length,completedToday,weekRate:week.length?Math.round(doneWeek.length/week.length*100):100}}
  function hexRgb(hex){let x=hex.replace('#','');if(x.length===3)x=x.split('').map(c=>c+c).join('');return `${parseInt(x.slice(0,2),16)},${parseInt(x.slice(2,4),16)},${parseInt(x.slice(4,6),16)}`}

  function updateFavicon(color){const safe=/^#[0-9a-f]{6}$/i.test(color||'')?color:'#5b5bd6',svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${safe}"/><ellipse cx="32" cy="34" rx="24" ry="9" transform="rotate(-14 32 34)" fill="none" stroke="#fff" stroke-width="4" opacity=".62"/><circle cx="32" cy="31" r="13" fill="#fff"/><path d="M9 37c9 10 31 12 45 3 3-2 5-4 6-7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M22 29c7 2 14 2 21-1" fill="none" stroke="${safe}" stroke-width="2" stroke-linecap="round" opacity=".22"/></svg>`;let link=document.querySelector('link[rel="icon"]');if(!link){link=document.createElement('link');link.rel='icon';document.head.appendChild(link)}link.type='image/svg+xml';link.href='data:image/svg+xml,'+encodeURIComponent(svg);const mark=document.getElementById('brandMark');if(mark)mark.innerHTML=svg}

  /* BACKUP + DEMO */
  function exportBackup(prefix='orbit-complete-backup',silent=false){
    try{
      Store.flush();
      const backup={app:'Orbit School Agenda',backupVersion:2,exportedAt:new Date().toISOString(),state,ui:{page,calendarDate:calendarDate.toISOString(),calendarMode,selectedNote,filters}};
      const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);
      a.href=url;a.download=`${prefix}-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);if(!silent)toast('Complete backup downloaded');return true
    }catch(e){toast('Backup could not be created, so nothing was reset.','error');return false}
  }
  async function importBackup(file){
    try{
      const text=await file.text();if(text.length>10_000_000)throw Error('too large');const parsed=JSON.parse(text),payload=parsed&&parsed.state?parsed.state:parsed,data=Store.validate(payload);
      if(!confirm('Replace your current planner with this backup? Your tasks, subjects, notes, schedule, settings, theme, and other planner data will be restored.'))return;
      state=data;
      if(parsed&&parsed.ui){if(NAV.some(n=>n[0]===parsed.ui.page))page=parsed.ui.page;if(parsed.ui.calendarDate&&!isNaN(new Date(parsed.ui.calendarDate)))calendarDate=new Date(parsed.ui.calendarDate);if(['month','week','day'].includes(parsed.ui.calendarMode))calendarMode=parsed.ui.calendarMode;selectedNote=parsed.ui.selectedNote||null;if(parsed.ui.filters&&typeof parsed.ui.filters==='object')filters=Object.assign(filters,parsed.ui.filters)}

  function parseStudySource(text,template){const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x.length>2).slice(0,50);const pairs=lines.map(line=>{let p=line.split(/\s*[:=–—]\s*/);if(p.length>1)return {q:p.shift(),a:p.join(' – ')};let q=line.match(/^(.+?)[?]\s*(.+)$/);if(q)return{q:q[1]+'?',a:q[2]};const words=line.split(/\s+/),key=words.find(w=>w.length>6)||words[Math.floor(words.length/2)]||line;return{q:line.replace(key,'_____'),a:key}});if(template==='flashcards')return pairs.map(x=>({q:x.q,a:x.a}));if(template==='cloze')return pairs.map(x=>({q:x.q.includes('_____')?x.q:`${x.q}: _____`,a:x.a}));if(template==='questions')return pairs.map(x=>({q:x.q.endsWith('?')?x.q:`Explain: ${x.q}`,a:x.a}));const answers=pairs.map(x=>x.a);return pairs.map((x,i)=>({q:x.q.endsWith('?')?x.q:`What matches “${x.q}”?`,a:x.a,options:[x.a,...answers.filter((_,j)=>j!==i).slice(0,3)].sort(()=>Math.random()-.5)}))}

  function translateUiString(value){if(language()==='en'||!value)return value;const lead=value.match(/^\s*/)?.[0]||'',trail=value.match(/\s*$/)?.[0]||'',core=value.trim();if(!core)return value;const dictionary=language()==='es'?ES_UI:LOCALE_UI[language()]||{},outExact=dictionary[core];let out=outExact||core;if(language()!=='en'){const greeting=core.match(/^(Good morning|Good afternoon|Good evening)(?=,|$)/);if(greeting&&dictionary[greeting[1]])out=core.replace(greeting[1],dictionary[greeting[1]])}if(language()==='es')for(const [re,repl] of ES_PATTERN_REPLACEMENTS){if(re.test(out)){out=out.replace(re,repl);break}}return lead+out+trail}

  function isUiOwnedText(node){const el=node.parentElement;if(!el)return true;if(el.closest('script,style,textarea'))return false;if(el.closest('.task-title,.current-class,.cal-item,.subject-card h3,.note-link strong,.device-key'))return false;return true}

  function translateUiTree(root=document.body){if(language()==='en'||!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(!isUiOwnedText(node))continue;let next=translateUiString(node.nodeValue);if(isDateContext(node.parentElement))next=translateDateWords(next);if(next!==node.nodeValue)node.nodeValue=next}root.querySelectorAll?.('[placeholder],[title],[aria-label]').forEach(el=>{for(const attr of ['placeholder','title','aria-label']){if(!el.hasAttribute(attr))continue;const old=el.getAttribute(attr),next=translateUiString(old);if(next!==old)el.setAttribute(attr,next)}})}

  function organizeThemeSelection(){

    const groups=[['Core',['light','dark','minimal','contrast','porcelain','linen','ink','slate']],['Nature',['seasons','forest','ocean','sky','mint','matcha','ice','lagoon','meadow','alpine','coralreef']],['Warm & bright',['warm','sunset','amber','sand','coffee','paper','campus','apricot','terracotta','sunflower','desert']],['Colorful',['purple','lavender','rose','cherry','berry','indigo','candy','peacock','orchid','prism']],['Night',['halloween','midnight','graphite','neon','cobalt','plum','solar','aurora','stargazer','eclipse','deepsea','cyberpunk','ember']],['Create your own',['custom']]];

  /* Tone-aware schedule: preserve every theme's own gradient and shape. Choose
     the gentlest dark or light tint that gives ordinary text a WCAG 4.5:1
     contrast against the brightest and darkest opaque colors in the gradient. */
  function updateTodayScheduleTheme(){
    const card=document.querySelector('#view .today-schedule-card');
    if(!card)return;
    const css=getComputedStyle(card),st=card.style;
    const unpack=(str)=>{
      if(!str)return null;
      const c=str.trim();
      if(c.startsWith('#')){
        let h=c.slice(1);
        if(h.length===3)h=h.split('').map(x=>x+x).join('');
        if(h.length!==6)return null;
        return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
      }
      const rgb=c.match(/^rgba?\(\s*([\d.]+)[, ]+([\d.]+)[, ]+([\d.]+)(?:[, /]+([\d.]+))?\s*\)$/i);
      if(rgb){if(rgb[4]!==undefined&&Number(rgb[4])<.65)return null;return rgb.slice(1,4).map(Number);}
      const srgb=c.match(/^color\(srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)(?:\s*\/\s*([\d.]+))?\)$/i);
      if(srgb){if(srgb[4]!==undefined&&Number(srgb[4])<.65)return null;return srgb.slice(1,4).map(x=>Math.round(Number(x)*255));}
      return null;
    };
    const colors=(css.backgroundImage.match(/rgba?\([^)]*\)|color\(srgb[^)]*\)|#[0-9a-fA-F]{3,8}/g)||[])
      .map(unpack).filter(Boolean);
    const base=unpack(css.backgroundColor);
    if(!colors.length&&base)colors.push(base);
    if(!colors.length){const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();colors.push(unpack(accent)||[70,90,155]);}
    const lum=(rgb)=>rgb.map(v=>{const c=Math.max(0,Math.min(255,v))/255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)})
      .reduce((v,c,i)=>v+c*[.2126,.7152,.0722][i],0);
    const blend=(a,b,alpha)=>a.map((n,i)=>n*(1-alpha)+b[i]*alpha);
    const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
    const required=(ink,tint)=>{
      let lo=0,hi=1;
      for(let i=0;i<13;i++){
        const mid=(lo+hi)/2;
        if(colors.every(c=>contrast(ink,blend(c,tint,mid))>=4.65))hi=mid;
        else lo=mid;
      }
      return hi;
    };
    const accent=unpack(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim())||[74,84,151];
    const darkTint=blend([9,19,30],accent,.12), lightTint=[255,253,250];

    const d=required(white,darkTint),l=required(dark,lightTint);
    // Prefer preserving saturated hero colors. A light veil belongs on bright
    // palettes only when it needs clearly less coverage than a dark veil.
    // 1.2.0: always use white foreground with theme-tinted dark veil.
    const useLight=false;
    const a=Math.min(.94,Math.max(.05,d+.045));
    const tint=darkTint,ink='#ffffff';
    st.setProperty('--schedule-ink',ink);
    st.setProperty('--schedule-muted',useLight?'#354658':'#eff3fc');
    st.setProperty('--schedule-tint',`rgba(${tint.map(Math.round).join(',')},${a.toFixed(3)})`);
    st.setProperty('--schedule-text-shadow',useLight?'none':'0 1px 2px rgba(0,0,0,.2)');
    st.setProperty('--schedule-rule',useLight?'rgba(23,34,48,.42)':'rgba(255,255,255,.62)');
    st.setProperty('--schedule-chip',useLight?'rgba(23,34,48,.055)':'rgba(255,255,255,.09)');
    st.setProperty('--schedule-chip-active',useLight?'rgba(23,34,48,.11)':'rgba(255,255,255,.16)');
    card.dataset.scheduleTone=useLight?'light':'dark';
  }

  function saveSetupMiniSubject(form){

stion is not in Help & Answers?", "Use the Feedback page to describe your question. You can include an email address if you would like the site owner to be able to reply."], ["Feedback & troubleshooting", "Can I send Feedback without entering my name?", "Yes. Your name and email are optional. Write a message and select the feedback type, then send."], ["Feedback & troubleshooting", "Can I send feedback from a Chromebook?", "You can send a written report from a Chromebook if its browser and school network allow access to the feedback service."], ["Feedback & troubleshooting", "Why did sending feedback fail?", "Check your connection and the status message next to Send feedback. Rate limits, network restrictions, or a delivery service error can prevent sending. Your message stays in the form if delivery fails."], ["Feedback & troubleshooting", "Can I get a reply to my question?", "You can optionally provide an email address when submitting feedback. A response depends on whether the site owner reviews the message and chooses to reply."], ["Feedback & troubleshooting", "What information should I include in a bug report?", "Tell us the page, what you clicked, what you expected, what happened instead, and the browser you use. Do not include passwords, school account details, or other private information."], ["Feedback & troubleshooting", "How do I fix a page that will not load correctly?", "Refresh the page, check the network, and try opening Orbit in a current browser. Before clearing site data, export a backup to avoid losing planner information."]];

  function filterHelpQuestions(){
    const search=(document.getElementById('helpSearch')?.value||'').trim().toLocaleLowerCase();
    let shown=0;
    document.querySelectorAll('#view [data-help-section]').forEach(section=>{
      const category=section.dataset.category;
      let count=0;
      section.querySelectorAll('[data-help-question]').forEach(item=>{
        const match=(!search||item.textContent.toLocaleLowerCase().includes(search))&&(helpCategory==='All topics'||helpCategory===category);
        item.hidden=!match;if(match){count++;shown++}
      });
      section.hidden=!count;
    });
    document.querySelectorAll('#view [data-help-category]').forEach(button=>{
      const active=button.dataset.helpCategory===helpCategory;
      button.setAttribute('aria-pressed',String(active));button.classList.toggle('active',active);
    });
    const results=document.getElementById('helpResults');if(results)results.textContent=`${shown} ${feedbackWords('answers','respuestas')}`;
    const empty=document.getElementById('helpEmpty');if(empty)empty.hidden=shown!==0;
  }

','¿Buscas una respuesta rápida?')}</strong><p class="small muted">${t('Find help with assignments, backups, calendars, settings, and more.','Encuentra ayuda sobre tareas, copias de seguridad, calendarios y ajustes.')}</p></div><button type="button" class="btn" data-page="help">${t('Open Help & Answers','Abrir Ayuda y respuestas')} →</button></div><div class="feedback-inline-note"><span aria-hidden="true">🔒</span><span>${t('Your name and email are optional. Please do not include passwords, private school records, or other sensitive information.','Tu nombre y correo son opcionales. No incluyas contraseñas, documentos escolares privados ni otros datos sensibles.')}</span></div></section></div>`;

  function feedbackDeliveryNotice(message,problem=true){
    const box=document.getElementById('feedbackDeliveryStatus');
    if(!box)return;
    box.hidden=!message;
    box.textContent=message||'';
    box.classList.toggle('has-error',!!problem);
  }
  async function submitFeedback(){
    const form=document.getElementById('feedbackForm');
    if(!form||!form.reportValidity())return;
    const message=document.getElementById('feedbackMessage')?.value.trim()||'';
    if(!message){
      feedbackDeliveryNotice(feedbackWords('Please describe your question, idea, or problem before sending.','Describe tu pregunta, idea o problema antes de enviarlo.'));
      document.getElementById('feedbackMessage')?.focus();
      return;
    }
    const rate=feedbackRateStatus();
    if(!rate.remaining){
      updateFeedbackLimitUI();
      return feedbackDeliveryNotice(feedbackWords('Feedback limit reached. Please try again in 15 minutes.','Límite alcanzado. Vuelve a intentarlo en 15 minutos.'));
    }
    if(!CONFIG.feedbackEndpoint)return feedbackDeliveryNotice(feedbackWords('Feedback delivery is not configured yet. Please try again later.','El envío de comentarios todavía no está configurado. Vuelve a intentarlo más tarde.'));
    const data=new FormData(form);
    data.set('page',location.protocol==='file:'?'local file':location.origin+location.pathname);
    data.set('sentAt',new Date().toISOString());
    const button=form.querySelector('[data-action="send-feedback"]');
    if(!button)return;
    const label=button.textContent;
    button.disabled=true;
    button.textContent=feedbackWords('Sending…','Enviando…');
    feedbackDeliveryNotice('');
    try{
      const response=await fetch(CONFIG.feedbackEndpoint,{
        method:'POST',headers:{Accept:'application/json'},body:data
      });
      if(!response.ok){
        const body=await response.json().catch(()=>null);
        const reason=body?.errors?.map(item=>item.message).filter(Boolean).join(' ')||body?.error||`HTTP ${response.status}`;
        const error=new Error(reason);error.status=response.status;throw error;
      }
      form.reset();recordFeedbackSend();updateFeedbackLimitUI();
      feedbackDeliveryNotice(feedbackWords('Your feedback was sent successfully. Thank you!','Tu comentario se envió correctamente. ¡Gracias!'),false);
      toast(feedbackWords('Feedback sent. Thank you!','¡Comentario enviado! Gracias.'));
    }catch(error){
      const explanation=error.status===429?
        feedbackWords('Too many requests. Please wait a few minutes and retry.','Demasiadas solicitudes. Espera unos minutos y vuelve a intentarlo.'):
        feedbackWords(`Feedback was not sent: ${error.message||'Network error'}. Your message is still here so you can try again.`,`No se envió el comentario: ${error.message||'Error de red'}. Tu mensaje sigue aquí para que lo intentes de nuevo.`);
      feedbackDeliveryNotice(explanation);
      toast(feedbackWords('Feedback could not be sent. Check the form for details.','No se pudo enviar el comentario. Revisa el formulario.'),'error');
    }finally{
      button.textContent=label;
      if(feedbackRateStatus().remaining)button.disabled=false;
    }
  }
  document.addEventListener('submit',event=>{
    if(event.target.id==='feedbackForm'){
      event.preventDefault();submitFeedback();
    }
  },true);

      Array.from({length:batCount},(_,i)=>`<span class="halloween-bat" style="--top:${16+i*9}%;--delay:-${4+i*8}s;--duration:${32+i*7}s;--scale:${.68+i*.19};"></span>`).join('')+

    document.body.append(layer);
  }

  /* APP INITIALIZATION */
  let lastClockDay=today();async function boot(){try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(_){ }await Store.load();applyTheme();render();if(!state.setup)renderSetup();setInterval(checkReminders,30000);setInterval(()=>Store.flush(),15000);setInterval(()=>{updateSideClock();const d=today();if(d!==lastClockDay){lastClockDay=d;render()}},1000);window.addEventListener('storage',async e=>{if(e.key===CONFIG.key){await Store.load();render();toast('Planner updated from another tab')}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')Store.flush();else{checkReminders();updateSideClock();const d=today();if(d!==lastClockDay){lastClockDay=d;render()}}});window.addEventListener('focus',()=>{checkReminders();updateSideClock()});window.addEventListener('pageshow',()=>{checkReminders();updateSideClock()});window.addEventListener('pagehide',()=>Store.flush());window.addEventListener('beforeunload',()=>Store.flush())}boot();
  </script>
